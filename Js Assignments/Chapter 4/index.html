<!DOCTYPE html>

    <title>Chapter 4</title>
</head>
<script>
    // a) Heading
document.write("<h1>Rules for naming JS variables</h1>");

// b) Variable names can only contain...
document.write("<p>Variable names can only contain <b>letters</b>, <b>numbers</b>, <b>dollar signs ($)</b> and <b>underscores (_)</b>. For example $my_1stVariable</p>");

// c) Variables must begin with a...
document.write("<p>Variables must begin with a <b>letter</b>, <b>dollar sign ($)</b> or <b>underscore (_)</b>. For example $name, _name or name</p>");

// d) Variable names are case...
document.write("<p>Variable names are case <b>sensitive</b></p>");

// e) Variable names should not be JS...
document.write("<p>Variable names should not be JS <b>keywords</b></p>");
</script>
<body>

</body>
