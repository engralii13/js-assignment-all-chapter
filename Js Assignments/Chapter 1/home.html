<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <!-- 1. SCRIPT IN HEAD -->
    <script>
        alert("Welcome! Script is in HEAD.");
    </script>

</head>

<body>

    <!-- 2. BODY BEFORE PAGE HTML -->
    <script>
        alert("Script is in BODY before page HTML.");
    </script>


    <h1>My Website</h1>
    <p>Welcome to my website.</p>

    <!-- 3. SCRIPT INSIDE PAGE HTML -->
    <script>
        alert("Script is inside the page HTML.");
    </script>

    <h2>About Me</h2>
    <p>This is my website.</p>


    <!-- 4. BODY AFTER PAGE HTML -->
    <script>
        alert("Script is after the page HTML.");
    </script>

</body>
</html>
